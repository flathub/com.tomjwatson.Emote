app-id: com.tomjwatson.Emote
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: emote
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"
  - "*.a"
modules:
  - flatpak/python3-requirements.json
  - name: xdotool
    no-autogen: true
    make-args:
      - WITHOUT_RPATH_FIX=1
    make-install-args:
      - PREFIX=${FLATPAK_DEST}
    sources:
      - type: archive
        url: https://github.com/jordansissel/xdotool/archive/v4.20260303.1/xdotool-4.20260303.1.tar.gz
        sha256: c1f971a384da588eb99ca0755fc4300316d49c1e612537e3f1de52215e104fa3
        x-checker-data:
          type: anitya
          project-id: 8648
          stable-only: true
          url-template: https://github.com/jordansissel/xdotool/archive/v$version/xdotool-$version.tar.gz
    cleanup:
      - /share/man
  - name: emote
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/tom-james-watson/Emote/archive/refs/tags/v5.0.0-beta.5.tar.gz
        sha256: 61bbb4710b0af6f55c3b0bbd78c3733449df6339914c3c4d27f492bc7955b3b1
