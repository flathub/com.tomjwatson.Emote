app-id: com.tomjwatson.Emote
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: emote
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/bash-completion
  - /share/gir-1.0
  - /share/gtk-doc
  - /share/man
  - "*.la"
  - "*.a"
modules:
  # Required by python3-dbus-python module. But Why?
  - name: patchelf
    cleanup: ["*"]
    sources:
      - type: archive
        url: https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0.tar.gz
        sha256: 64de10e4c6b8b8379db7e87f58030f336ea747c0515f381132e810dbf84a86e7

  - flatpak/python3-requirements.json

  - name: keybinder-3.0
    sources:
      - type: archive
        url: https://github.com/kupferlauncher/keybinder/releases/download/keybinder-3.0-v0.3.2/keybinder-3.0-0.3.2.tar.gz
        sha256: e6e3de4e1f3b201814a956ab8f16dfc8a262db1937ff1eee4d855365398c6020

  - name: xdotool
    no-autogen: true
    make-args:
      - WITHOUT_RPATH_FIX=1
    make-install-args:
      - PREFIX=${FLATPAK_DEST}
    sources:
      - type: archive
        url: https://github.com/jordansissel/xdotool/archive/v4.20260303.1/xdotool-4.20260303.1.tar.gz
        sha256: c1f971a384da588eb99ca0755fc4300316d49c1e612537e3f1de52215e104fa3
        x-checker-data:
          type: anitya
          project-id: 8648
          stable-only: true
          url-template: https://github.com/jordansissel/xdotool/archive/v$version/xdotool-$version.tar.gz

  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/v2.3.0.tar.gz
        sha256: b4dc560973f0cd74e02f817ffa2fd44ba645a4f1ea94b7b9614dacc9f895f402
        x-checker-data:
          type: anitya
          project-id: 49082
          url-template: https://github.com/bugaevc/wl-clipboard/archive/v$version.tar.gz

  - name: emote
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/tom-james-watson/Emote/archive/refs/tags/v4.1.0.tar.gz
        sha256: 171ddf7e216f12a9e0ed63cd0a97796fd63967df3b3aa5e452877b74aabd48c9
      - type: patch
        path: fix_appdata.patch
